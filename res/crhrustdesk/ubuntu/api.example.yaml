lang: "en"
app:
  web-client: 0  # 1:启用 0:禁用
  register: false #是否开启注册
  register-status: 1 # 注册用户默认状态 1:启用 2:禁用
  captcha-threshold: 3 #   <0:disabled, 0 always, >0:enabled
  ban-threshold: 0 # 0:disabled, >0:enabled
  show-swagger: 0 # 1:启用 0:禁用
  token-expire: 1h
  web-sso: false #web auth sso
  disable-pwd-login: false #禁用密码登录

admin:
  title: "CrhRustDesk Admin"
  hello-file: "./conf/admin/hello.html"  #优先使用file
  hello: ""
  # ID Server and Relay Server ports https://github.com/lejianwen/rustdesk-api/issues/257
  id-server-port: 21116  # ID Server port (for server cmd)
  relay-server-port: 21117 # ID Server port (for server cmd)
gin:
  api-addr: "127.0.0.1:21114"
  mode: "release" #release,debug,test
  resources-path: 'resources'  #对外静态文件目录
  trust-proxy: ""
gorm:
  type: "sqlite"
  max-idle-conns: 10
  max-open-conns: 100
mysql:
  username: ""
  password: ""
  addr: ""
  dbname: ""
  tls: "false" # true / false / skip-verify / custom

postgresql:
  host: "127.0.0.1"
  port: "5432"
  user: ""
  password: ""
  dbname: "postgres"
  sslmode: "disable" # disable, require, verify-ca, verify-full
  time-zone: "Asia/Shanghai" # Time zone for PostgreSQL connection

rustdesk:
  id-server: "172.16.1.83:21116"
  relay-server: "172.16.1.83:21117"
  api-server: "https://172.16.1.83:8443"
  key: ""
  key-file: "/var/lib/crhrustdesk/transport/x86_64/id_ed25519.pub"
  personal: 1
  webclient-magic-queryonline: 0
  ws-host: ""  #eg: wss://192.168.1.3:4443
logger:
  path: "/var/lib/crhrustdesk/log/api.log"
  level: "info" #trace,debug,info,warn,error,fatal
  report-caller: true
proxy:
  enable: false
  host: "http://127.0.0.1:1080"
jwt:
  key: ""
  expire-duration: 1h
ldap:
  enable: true
  url: "ldap://172.16.1.10:389"
  tls-ca-file: ""
  tls-verify: true
  base-dn: "DC=crhdomain,DC=local"
  bind-dn: "LDAP_BIND_UPN"
  bind-password: ""
  user:
    base-dn: "DC=crhdomain,DC=local"
    enable-attr: "userAccountControl"
    enable-attr-value: "ignored-for-ad"
    filter: "(&(objectCategory=person)(objectClass=user))"
    username: "sAMAccountName"
    email: "mail"
    first-name: "givenName"
    last-name: "sn"
    sync: true
    admin-group: ""
    allow-group: ""

